<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>墨西哥每日一字 · 單字卡瀏覽器</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --card-w: min(92vw, 400px);
  }
  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Noto Sans TC', sans-serif;
    background: #eef0f6;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 12px 48px;
    color:#1b1c22;
  }

  h1{
    font-family:'Fredoka', sans-serif;
    font-size: 22px;
    letter-spacing: .5px;
    margin: 0 0 4px;
    display:flex;
    align-items:center;
    gap:8px;
    color:#20222b;
  }
  .subtitle{
    font-size:12.5px;
    color:#8a8d9c;
    margin-bottom: 18px;
    text-align:center;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    color:#6c6f80;
    width: var(--card-w);
    margin-bottom: 18px;
  }
  .progress-track{
    flex:1;
    height:7px;
    border-radius:99px;
    background: #dfe2ec;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg,#2e9e5b,#8fd19e);
    width:0%;
    transition: width .3s ease;
  }

  .stage{
    width: var(--card-w);
    max-width: 96vw;
  }

  .card{
    position:relative;
    width:100%;
    background:#fff;
    border-radius: 26px;
    box-shadow: 0 18px 40px rgba(20,22,40,0.14);
    overflow:hidden;
    opacity:1;
    transform: translateY(0);
    transition: opacity .22s ease, transform .22s ease;
  }
  .card.fading{ opacity:0; transform: translateY(8px); }

  /* ---- rich card (new format) ---- */
  .media{
    position:relative;
    width:100%;
    aspect-ratio: 4 / 3;
    background:#eee;
    overflow:hidden;
  }
  .media img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .bookmark-btn{
    position:absolute;
    top:14px; right:14px;
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background: rgba(255,255,255,0.92);
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    cursor:pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    color:#c9cbd6;
  }
  .bookmark-btn.active{ color:#f5a623; }

  .body{
    padding: 20px 24px 22px;
  }
  .word-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .word-es{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size: 30px;
    color:#16171d;
    line-height:1.15;
    word-break: break-word;
  }
  .audio-btn{
    flex:none;
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background:#1b1c22;
    color:#fff;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .audio-btn:hover{ background:#33343e; }
  .audio-btn:active{ transform: scale(.92); }
  .audio-btn.small{ width:32px; height:32px; font-size:13px; }

  .pos-row{
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .pos-badge{
    font-size:12px;
    font-weight:700;
    color:#6c6f80;
    background:#eef0f6;
    padding:3px 10px;
    border-radius:999px;
  }
  .word-zh{
    font-size:16.5px;
    font-weight:700;
    color:#2b2d36;
  }

  .desc-zh{
    margin-top:14px;
    font-size:13.5px;
    line-height:1.65;
    color:#565968;
  }

  hr.divider{
    border:none;
    border-top:1px solid #eceef4;
    margin: 16px 0;
  }

  .example-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .example-es{
    font-size:14.5px;
    font-style:italic;
    color:#2b2d36;
    line-height:1.55;
  }
  .example-zh{
    margin-top:8px;
    font-size:13px;
    color:#8a8d9c;
    line-height:1.55;
  }

  .meta-row{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .day-tag{
    font-size:11.5px;
    color:#a3a6b3;
  }
  .status-tag{
    font-size:11.5px;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
    background:#eef0f6;
    color:#a3a6b3;
  }
  .status-tag.known{
    background:#e4f5ea;
    color:#2e9e5b;
  }

  .actions{
    display:flex;
    gap:10px;
    padding: 0 24px 22px;
  }
  .actions button{
    flex:1;
    padding: 13px 0;
    border-radius: 14px;
    font-size:14.5px;
    font-weight:700;
    font-family:'Noto Sans TC', sans-serif;
    cursor:pointer;
    border:2px solid #1b1c22;
    transition: transform .1s ease;
  }
  .actions button:active{ transform: scale(.97); }
  .btn-know{
    background:#fff;
    color:#1b1c22;
  }
  .btn-learn{
    background:#1b1c22;
    color:#fff;
  }

  /* ---- legacy card (old composited image) ---- */
  .legacy-img{
    width:100%;
    display:block;
  }

  .nav-row{
    margin-top: 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  .nav-btn{
    width:44px; height:44px;
    border-radius:50%;
    border:none;
    background:#fff;
    color:#1b1c22;
    font-size:19px;
    cursor:pointer;
    box-shadow: 0 6px 14px rgba(20,22,40,0.12);
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease;
  }
  .nav-btn:hover{ transform: scale(1.05); }
  .nav-btn:disabled{ opacity:.3; cursor:default; }
  .nav-btn:disabled:hover{ transform:none; }
  .page-counter{
    font-size:13px;
    color:#6c6f80;
    min-width:56px;
    text-align:center;
  }

  .empty{
    text-align:center;
    color:#6c6f80;
    line-height:1.8;
    font-size:14px;
  }
</style>
</head>
<body>

  <h1>🇲🇽 墨西哥每日一字 · 單字卡瀏覽器</h1>
  <div class="subtitle">左右切換瀏覽每天學過的單字卡 · 點喇叭聽發音 · 標記「我知道了 / 我要學習」追蹤進度</div>

  <div id="app"></div>

<script src="manifest.js"></script>
<script>
(function(){
  const cards = (window.CARD_LIST || []).slice().sort((a,b)=> a.date.localeCompare(b.date));
  const app = document.getElementById('app');

  if(!cards.length){
    app.innerHTML = '<div class="empty">目前還沒有任何單字卡。<br>每天排程執行後，新卡片會自動出現在這裡。</div>';
    return;
  }

  const STATUS_KEY = 'mx_word_ok_status_v1';       // {date: true(已知) / false(待複習)}
  const BOOKMARK_KEY = 'mx_word_bookmark_v1';       // {date: true}
  const LAST_PAGE_KEY = 'mx_word_last_page_v1';

  function loadJSON(key){
    try{ return JSON.parse(localStorage.getItem(key) || '{}'); }catch(e){ return {}; }
  }
  function saveJSON(key, obj){
    localStorage.setItem(key, JSON.stringify(obj));
  }

  let statusMap = loadJSON(STATUS_KEY);
  let bookmarkMap = loadJSON(BOOKMARK_KEY);

  function loadLastIndex(){
    try{
      const savedDate = localStorage.getItem(LAST_PAGE_KEY);
      if(savedDate){
        const found = cards.findIndex(c => c.date === savedDate);
        if(found >= 0) return found;
      }
    }catch(e){}
    return 0;
  }
  function saveLastIndex(){
    try{ localStorage.setItem(LAST_PAGE_KEY, cards[idx].date); }catch(e){}
  }

  let idx = loadLastIndex();

  const stage = document.createElement('div');
  stage.className = 'stage';
  app.appendChild(stage);

  const progressRow = document.createElement('div');
  progressRow.className = 'progress-row';
  progressRow.innerHTML = '<span id="okCounter"></span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><span id="pageCounter"></span>';
  app.insertBefore(progressRow, stage);

  const progressFill = document.getElementById('progressFill');
  const okCounter = document.getElementById('okCounter');
  const pageCounter = document.getElementById('pageCounter');

  function speak(text){
    if(!text || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-MX';
      u.rate = 0.95;
      const voices = speechSynthesis.getVoices();
      const esVoice = voices.find(v => v.lang === 'es-MX') || voices.find(v => v.lang && v.lang.startsWith('es'));
      if(esVoice) u.voice = esVoice;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  // warm up voice list (some browsers load it async)
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  function refreshStats(){
    const total = cards.length;
    const knownCount = cards.filter(c => statusMap[c.date] === true).length;
    progressFill.style.width = (knownCount / total * 100).toFixed(1) + '%';
    okCounter.textContent = '已知道 ' + knownCount + ' / ' + total;
    pageCounter.textContent = (idx+1) + ' / ' + total;
  }

  function dayTagText(card, i){
    return '第 ' + (i+1) + ' 天 · ' + card.date;
  }

  function renderRichCard(card, i){
    const known = statusMap[card.date];
    const bookmarked = !!bookmarkMap[card.date];
    const statusLabel = known === true ? '已知道' : (known === false ? '待複習' : '尚未標記');
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="media">
        <img src="${card.image}" alt="${card.word_es}">
        <button class="bookmark-btn ${bookmarked ? 'active' : ''}" id="bookmarkBtn" title="收藏">🔖</button>
      </div>
      <div class="body">
        <div class="word-row">
          <div class="word-es">${card.word_es}</div>
          <button class="audio-btn" id="wordAudioBtn" title="播放發音">🔊</button>
        </div>
        <div class="pos-row">
          <span class="pos-badge">${card.pos || ''}</span>
          <span class="word-zh">${card.word_zh || ''}</span>
        </div>
        ${card.desc_zh ? `<div class="desc-zh">${card.desc_zh}</div>` : ''}
        <hr class="divider">
        <div class="example-row">
          <div class="example-es">"${card.example_es || ''}"</div>
          <button class="audio-btn small" id="exampleAudioBtn" title="播放例句發音">🔊</button>
        </div>
        <div class="example-zh">${card.example_zh || ''}</div>
        <div class="meta-row">
          <span class="day-tag">${dayTagText(card, i)}</span>
          <span class="status-tag ${known === true ? 'known' : ''}">${statusLabel}</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn-know" id="knowBtn">我知道了</button>
        <button class="btn-learn" id="learnBtn">我要學習</button>
      </div>
    `;
    return wrap;
  }

  function renderLegacyCard(card, i){
    const known = statusMap[card.date];
    const statusLabel = known === true ? '已知道' : (known === false ? '待複習' : '尚未標記');
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <img class="legacy-img" src="每日一字/${card.file}" alt="${card.word || ''}">
      <div class="body" style="padding-top:16px;">
        <div class="meta-row" style="margin-top:0;">
          <span class="day-tag">${dayTagText(card, i)}</span>
          <span class="status-tag ${known === true ? 'known' : ''}">${statusLabel}</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn-know" id="knowBtn">我知道了</button>
        <button class="btn-learn" id="learnBtn">我要學習</button>
      </div>
    `;
    return wrap;
  }

  function render(){
    const card = cards[idx];
    const isRich = !!card.word_es;
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.appendChild(isRich ? renderRichCard(card, idx) : renderLegacyCard(card, idx));

    stage.innerHTML = '';
    stage.appendChild(cardEl);

    if(isRich){
      document.getElementById('wordAudioBtn').addEventListener('click', () => speak(card.word_es));
      document.getElementById('exampleAudioBtn').addEventListener('click', () => speak(card.example_es));
      document.getElementById('bookmarkBtn').addEventListener('click', () => {
        bookmarkMap[card.date] = !bookmarkMap[card.date];
        saveJSON(BOOKMARK_KEY, bookmarkMap);
        render();
      });
    }
    document.getElementById('knowBtn').addEventListener('click', () => markAndAdvance(true));
    document.getElementById('learnBtn').addEventListener('click', () => markAndAdvance(false));

    refreshStats();
    saveLastIndex();

    // fade-in
    requestAnimationFrame(()=>{ cardEl.classList.remove('fading'); });
  }

  function markAndAdvance(known){
    statusMap[cards[idx].date] = known;
    saveJSON(STATUS_KEY, statusMap);
    if(idx < cards.length - 1){
      goNext();
    } else {
      render();
    }
  }

  function goTo(newIdx){
    if(newIdx < 0 || newIdx >= cards.length || newIdx === idx) return;
    idx = newIdx;
    render();
  }
  function goNext(){ goTo(idx+1); }
  function goPrev(){ goTo(idx-1); }

  const navRow = document.createElement('div');
  navRow.className = 'nav-row';
  navRow.innerHTML = `
    <button class="nav-btn" id="prevBtn">‹</button>
    <button class="nav-btn" id="nextBtn">›</button>
  `;
  app.appendChild(navRow);
  document.getElementById('prevBtn').addEventListener('click', goPrev);
  document.getElementById('nextBtn').addEventListener('click', goNext);

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight') goNext();
    if(e.key === 'ArrowLeft') goPrev();
  });

  function updateNavButtons(){
    document.getElementById('prevBtn').disabled = idx === 0;
    document.getElementById('nextBtn').disabled = idx === cards.length - 1;
  }

  const originalRender = render;
  render = function(){
    originalRender();
    updateNavButtons();
  };

  window.addEventListener('beforeunload', saveLastIndex);
  window.addEventListener('pagehide', saveLastIndex);

  render();
})();
</script>
</body>
</html>
