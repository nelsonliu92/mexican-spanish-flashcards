<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>墨西哥每日一字 · 單字卡瀏覽器</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<link rel="manifest" href="icons/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日一字">
<meta name="theme-color" content="#046a38">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --card-w: min(92vw, 400px);
  }
  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Noto Sans TC', sans-serif;
    background: #eef0f6;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 12px 48px;
    color:#1b1c22;
  }

  h1{
    font-family:'Fredoka', sans-serif;
    font-size: 22px;
    letter-spacing: .5px;
    margin: 0 0 4px;
    display:flex;
    align-items:center;
    gap:8px;
    color:#20222b;
  }
  .subtitle{
    font-size:12.5px;
    color:#8a8d9c;
    margin-bottom: 18px;
    text-align:center;
    min-height: 16px;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    color:#6c6f80;
    width: var(--card-w);
    margin-bottom: 18px;
  }
  .progress-track{
    flex:1;
    height:7px;
    border-radius:99px;
    background: #dfe2ec;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg,#2e9e5b,#8fd19e);
    width:0%;
    transition: width .3s ease;
  }

  .stage{
    width: var(--card-w);
    max-width: 96vw;
  }

  .card{
    position:relative;
    width:100%;
    background:#fff;
    border-radius: 26px;
    box-shadow: 0 18px 40px rgba(20,22,40,0.14);
    overflow:hidden;
    opacity:1;
    transform: translateY(0);
    transition: opacity .22s ease, transform .22s ease;
  }
  .card.fading{ opacity:0; transform: translateY(8px); }

  /* ---- rich card (new format) ---- */
  .media{
    position:relative;
    width:100%;
    aspect-ratio: 4 / 3;
    background:#eee;
    overflow:hidden;
  }
  .media img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .status-indicator{
    position:absolute;
    top:14px; right:14px;
    width:54px; height:54px;
    border-radius:50%;
    background: #f7dfa0; /* 米黃底，兩種狀態底色相同 */
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    color:#1b1c22; /* 尚未知道 = 黑色圖示 */
    transition: color .15s ease;
  }
  .status-indicator.known{ color:#2e9e5b; } /* 已知道 = 綠色圖示 */
  .status-indicator svg{
    width:28px; height:28px;
    fill: currentColor;
    display:block;
  }

  .body{
    padding: 20px 24px 22px;
  }
  .word-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .word-es{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size: 30px;
    color:#16171d;
    line-height:1.15;
    word-break: break-word;
  }
  .audio-btn{
    flex:none;
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background:#1b1c22;
    color:#fff;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .audio-btn:hover{ background:#33343e; }
  .audio-btn:active{ transform: scale(.92); }
  .audio-btn.small{ width:32px; height:32px; font-size:13px; }

  .pos-row{
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .pos-badge{
    font-size:12px;
    font-weight:700;
    color:#6c6f80;
    background:#eef0f6;
    padding:3px 10px;
    border-radius:999px;
  }
  .word-zh{
    font-size:16.5px;
    font-weight:700;
    color:#2b2d36;
  }

  .desc-zh{
    margin-top:14px;
    font-size:13.5px;
    line-height:1.65;
    color:#565968;
  }

  hr.divider{
    border:none;
    border-top:1px solid #eceef4;
    margin: 16px 0;
  }

  .example-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .example-es{
    font-size:14.5px;
    font-style:italic;
    color:#2b2d36;
    line-height:1.55;
  }
  .example-zh{
    margin-top:8px;
    font-size:13px;
    color:#8a8d9c;
    line-height:1.55;
  }

  .meta-row{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .day-tag{
    font-size:11.5px;
    color:#a3a6b3;
  }
  .status-tag{
    font-size:11.5px;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
    background:#eef0f6;
    color:#a3a6b3;
  }
  .status-tag.known{
    background:#e4f5ea;
    color:#2e9e5b;
  }

  .actions{
    display:flex;
    gap:10px;
    padding: 0 24px 22px;
  }
  .actions button{
    flex:1;
    padding: 13px 0;
    border-radius: 14px;
    font-size:14.5px;
    font-weight:700;
    font-family:'Noto Sans TC', sans-serif;
    cursor:pointer;
    border:2px solid #1b1c22;
    transition: transform .1s ease;
  }
  .actions button:active{ transform: scale(.97); }
  .btn-know{
    background:#fff;
    color:#1b1c22;
  }
  .btn-learn{
    background:#1b1c22;
    color:#fff;
  }
  .btn-learn:disabled{
    opacity:.55;
    cursor:default;
    transform:none !important;
  }

  /* ---- legacy card (old composited image) ---- */
  .legacy-img{
    width:100%;
    display:block;
    pointer-events:none;
  }

  .page-counter{
    font-size:13px;
    color:#6c6f80;
    min-width:56px;
    text-align:center;
  }

  .empty{
    text-align:center;
    color:#6c6f80;
    line-height:1.8;
    font-size:14px;
  }

  /* ---- home page ---- */
  .home-card{
    width: var(--card-w);
    max-width: 96vw;
    background:#fff;
    border-radius: 26px;
    box-shadow: 0 18px 40px rgba(20,22,40,0.14);
    padding: 48px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    text-align:center;
  }
  .home-emoji{ font-size:46px; }
  .home-title{
    font-family:'Fredoka', sans-serif;
    font-size:20px;
    font-weight:700;
    color:#20222b;
    margin:0 0 10px;
  }
  .home-btn{
    width:100%;
    padding:16px 0;
    border-radius:16px;
    font-size:16px;
    font-weight:700;
    font-family:'Noto Sans TC', sans-serif;
    cursor:pointer;
    border:2px solid #1b1c22;
    transition: transform .1s ease;
  }
  .home-btn:active{ transform: scale(.97); }
  .home-btn.primary{ background:#1b1c22; color:#fff; }
  .home-btn.secondary{ background:#fff; color:#1b1c22; }

  /* ---- back link ---- */
  .back-row{
    width: var(--card-w);
    max-width: 96vw;
    margin-bottom: 12px;
  }
  .back-link{
    background:none;
    border:none;
    color:#6c6f80;
    font-size:13px;
    cursor:pointer;
    padding:6px 0;
    display:flex;
    align-items:center;
    gap:4px;
    font-family:'Noto Sans TC', sans-serif;
  }
  .back-link:hover{ color:#1b1c22; }

  /* ---- library page ---- */
  .library-container{
    width: var(--card-w);
    max-width: 96vw;
  }
  .library-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .library-card{
    background:#fff;
    border-radius:18px;
    box-shadow: 0 8px 20px rgba(20,22,40,0.1);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .library-info{ flex:1; min-width:0; }
  .library-word{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:17px;
    color:#16171d;
    word-break: break-word;
  }
  .library-zh{
    font-size:12.5px;
    color:#8a8d9c;
    margin-top:2px;
  }
  .library-remove{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:#fdeaea;
    color:#d9483f;
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s ease;
  }
  .library-remove:hover{ background:#f8d3d1; }
  .library-empty{
    text-align:center;
    color:#8a8d9c;
    font-size:13.5px;
    line-height:1.8;
    padding:40px 20px;
  }
</style>
</head>
<body>

  <h1>🇲🇽 墨西哥每日一字 · 單字卡瀏覽器</h1>
  <div class="subtitle" id="subtitleText"></div>
  <div class="progress-row" id="progressRow" style="display:none">
    <span id="okCounter"></span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><span id="pageCounter"></span>
  </div>

  <div id="app"><div class="empty" id="loadingMsg">載入中…</div></div>

<script>
  // 防呆機制：如果 manifest.js 一直載入不出來（例如 OneDrive 檔案還沒完全同步到本機），
  // 幾秒後明確顯示錯誤訊息，而不是讓畫面一直維持空白。
  function mxShowTimeoutMsg(){
    var el = document.getElementById('app');
    if(el) el.innerHTML = '<div class="empty">⚠️ 單字資料載入逾時。<br>請確認 manifest.js 與此頁面在同一個資料夾，且此裝置的 OneDrive 已完整同步該檔案（非僅雲端佔位檔），再重新整理頁面試試看。</div>';
  }
  function mxShowManifestErrorMsg(){
    clearTimeout(window.__mxLoadTimer);
    var el = document.getElementById('app');
    if(el) el.innerHTML = '<div class="empty">⚠️ 找不到 manifest.js，請確認它與「單字卡瀏覽器.html」放在同一個資料夾內。</div>';
  }
  window.__mxLoadTimer = setTimeout(mxShowTimeoutMsg, 4000);
</script>
<script src="manifest.js" onerror="mxShowManifestErrorMsg()"></script>
<script>
clearTimeout(window.__mxLoadTimer);
(function(){
  const cards = (window.CARD_LIST || []).slice().sort((a,b)=> a.date.localeCompare(b.date));
  const app = document.getElementById('app');
  const subtitleEl = document.getElementById('subtitleText');
  const progressRow = document.getElementById('progressRow');

  if(!cards.length){
    app.innerHTML = '<div class="empty">目前還沒有任何單字卡。<br>每天排程執行後，新卡片會自動出現在這裡。</div>';
    return;
  }

  const STATUS_KEY = 'mx_word_ok_status_v1';       // {date: true(已知) / false(待複習)}
  const LIBRARY_KEY = 'mx_word_library_v1';        // [date, date, ...] 我的單字庫
  const LAST_PAGE_KEY = 'mx_word_last_page_v1';

  function loadJSON(key, fallback){
    try{ return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }catch(e){ return fallback; }
  }
  function saveJSON(key, obj){
    localStorage.setItem(key, JSON.stringify(obj));
  }

  let statusMap = loadJSON(STATUS_KEY, {});
  let libraryList = loadJSON(LIBRARY_KEY, []);

  function loadLastIndex(){
    try{
      const savedDate = localStorage.getItem(LAST_PAGE_KEY);
      if(savedDate){
        const found = cards.findIndex(c => c.date === savedDate);
        if(found >= 0) return found;
      }
    }catch(e){}
    return 0;
  }
  function saveLastIndex(){
    try{ localStorage.setItem(LAST_PAGE_KEY, cards[idx].date); }catch(e){}
  }

  let idx = loadLastIndex();
  let currentView = 'home'; // 'home' | 'study' | 'library'

  function speak(text){
    if(!text || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-MX';
      u.rate = 0.95;
      const voices = speechSynthesis.getVoices();
      const esVoice = voices.find(v => v.lang === 'es-MX') || voices.find(v => v.lang && v.lang.startsWith('es'));
      if(esVoice) u.voice = esVoice;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  // warm up voice list (some browsers load it async)
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  function isKnown(date){ return statusMap[date] === true; }

  // 找出第一張「尚未知道」的卡片索引（找不到就回第一張）
  function findFirstUnknownIndex(){
    const i = cards.findIndex(c => !isKnown(c.date));
    return i >= 0 ? i : 0;
  }
  function inLibrary(date){ return libraryList.indexOf(date) >= 0; }

  function addToLibrary(date){
    if(!inLibrary(date)){
      libraryList.push(date);
      saveJSON(LIBRARY_KEY, libraryList);
    }
  }
  function removeFromLibrary(date){
    libraryList = libraryList.filter(d => d !== date);
    saveJSON(LIBRARY_KEY, libraryList);
  }

  function refreshStats(){
    const total = cards.length;
    const knownCount = cards.filter(c => statusMap[c.date] === true).length;
    document.getElementById('progressFill').style.width = (knownCount / total * 100).toFixed(1) + '%';
    document.getElementById('okCounter').textContent = '已知道 ' + knownCount + ' / ' + total;
    document.getElementById('pageCounter').textContent = (idx+1) + ' / ' + total;
  }

  function dayTagText(card, i){
    return '第 ' + (i+1) + ' 天 · ' + card.date;
  }

  function renderRichCard(card, i){
    const known = isKnown(card.date);
    const alreadyInLib = inLibrary(card.date);
    const statusLabel = known ? '已知道' : (statusMap[card.date] === false ? '待複習' : '尚未標記');
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="media">
        <img src="${card.image}" alt="${card.word_es}">
        <div class="status-indicator ${known ? 'known' : ''}" title="${known ? '已知道' : '尚未知道'}">
          <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
        </div>
      </div>
      <div class="body">
        <div class="word-row">
          <div class="word-es">${card.word_es}</div>
          <button class="audio-btn" id="wordAudioBtn" title="播放發音">🔊</button>
        </div>
        <div class="pos-row">
          <span class="pos-badge">${card.pos || ''}</span>
          <span class="word-zh">${card.word_zh || ''}</span>
        </div>
        ${card.desc_zh ? `<div class="desc-zh">${card.desc_zh}</div>` : ''}
        <hr class="divider">
        <div class="example-row">
          <div class="example-es">"${card.example_es || ''}"</div>
          <button class="audio-btn small" id="exampleAudioBtn" title="播放例句發音">🔊</button>
        </div>
        <div class="example-zh">${card.example_zh || ''}</div>
        <div class="meta-row">
          <span class="day-tag">${dayTagText(card, i)}</span>
          <span class="status-tag ${known ? 'known' : ''}">${statusLabel}</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn-know" id="knowBtn">我知道了</button>
        <button class="btn-learn" id="learnBtn" ${alreadyInLib ? 'disabled' : ''}>${alreadyInLib ? '✓ 已加入單字庫' : '我要學習'}</button>
      </div>
    `;
    return wrap;
  }

  function renderLegacyCard(card, i){
    const known = isKnown(card.date);
    const alreadyInLib = inLibrary(card.date);
    const statusLabel = known ? '已知道' : (statusMap[card.date] === false ? '待複習' : '尚未標記');
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <img class="legacy-img" src="每日一字/${card.file}" alt="${card.word || ''}">
      <div class="body" style="padding-top:16px;">
        <div class="meta-row" style="margin-top:0;">
          <span class="day-tag">${dayTagText(card, i)}</span>
          <span class="status-tag ${known ? 'known' : ''}">${statusLabel}</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn-know" id="knowBtn">我知道了</button>
        <button class="btn-learn" id="learnBtn" ${alreadyInLib ? 'disabled' : ''}>${alreadyInLib ? '✓ 已加入單字庫' : '我要學習'}</button>
      </div>
    `;
    return wrap;
  }

  // 「我知道了」：可重複切換 —— 第一次按 +1 變綠燈，再按一次 -1 變回黑燈，停留在目前這張卡片
  function markKnown(){
    const date = cards[idx].date;
    const nowKnown = !(statusMap[date] === true);
    if(nowKnown){
      statusMap[date] = true;
    } else {
      delete statusMap[date];
    }
    saveJSON(STATUS_KEY, statusMap);
    refreshStats();

    const indicator = document.querySelector('.status-indicator');
    if(indicator){
      indicator.classList.toggle('known', nowKnown);
      indicator.title = nowKnown ? '已知道' : '尚未知道';
    }
    const statusTag = document.querySelector('.status-tag');
    if(statusTag){
      statusTag.classList.toggle('known', nowKnown);
      statusTag.textContent = nowKnown ? '已知道' : '尚未標記';
    }
  }

  // 「我要學習」：標記待複習並加入單字庫，停留在目前這張卡片（不換頁）
  function markLearn(){
    const date = cards[idx].date;
    statusMap[date] = false;
    saveJSON(STATUS_KEY, statusMap);
    addToLibrary(date);
    refreshStats();

    const indicator = document.querySelector('.status-indicator');
    if(indicator){
      indicator.classList.remove('known');
      indicator.title = '尚未知道';
    }
    const statusTag = document.querySelector('.status-tag');
    if(statusTag){
      statusTag.classList.remove('known');
      statusTag.textContent = '待複習';
    }
    const learnBtn = document.getElementById('learnBtn');
    if(learnBtn){
      learnBtn.disabled = true;
      learnBtn.textContent = '✓ 已加入單字庫';
    }
  }

  function goTo(newIdx){
    if(newIdx < 0 || newIdx >= cards.length || newIdx === idx) return;
    idx = newIdx;
    renderStudyView();
  }
  function goNext(){ goTo(idx+1); }
  function goPrev(){ goTo(idx-1); }

  document.addEventListener('keydown', (e)=>{
    if(currentView !== 'study') return;
    if(e.key === 'ArrowRight') goNext();
    if(e.key === 'ArrowLeft') goPrev();
  });

  function renderBackRow(){
    const row = document.createElement('div');
    row.className = 'back-row';
    row.innerHTML = `<button class="back-link" id="backHomeBtn">‹ 返回主頁</button>`;
    app.appendChild(row);
    document.getElementById('backHomeBtn').addEventListener('click', ()=>{
      currentView = 'home';
      renderView();
    });
  }

  function renderHomeView(){
    subtitleEl.textContent = '選擇你想做的事';
    progressRow.style.display = 'none';
    app.innerHTML = '';
    const homeCard = document.createElement('div');
    homeCard.className = 'home-card';
    homeCard.innerHTML = `
      <div class="home-emoji">🇲🇽</div>
      <div class="home-title">墨西哥每日一字</div>
      <button class="home-btn primary" id="btnStudy">📖 單字學習</button>
      <button class="home-btn secondary" id="btnLibrary">⭐ 我的單字庫</button>
    `;
    app.appendChild(homeCard);
    document.getElementById('btnStudy').addEventListener('click', ()=>{
      idx = findFirstUnknownIndex();
      currentView = 'study';
      renderView();
    });
    document.getElementById('btnLibrary').addEventListener('click', ()=>{ currentView = 'library'; renderView(); });
  }

  function renderStudyView(){
    subtitleEl.textContent = '左右滑動或鍵盤方向鍵切換 · 點喇叭聽發音 · 標記「我知道了 / 我要學習」追蹤進度';
    progressRow.style.display = 'flex';
    app.innerHTML = '';
    renderBackRow();

    const stage = document.createElement('div');
    stage.className = 'stage';
    app.appendChild(stage);

    const card = cards[idx];
    const isRich = !!card.word_es;
    const cardEl = document.createElement('div');
    cardEl.className = 'card fading';
    cardEl.appendChild(isRich ? renderRichCard(card, idx) : renderLegacyCard(card, idx));

    stage.innerHTML = '';
    stage.appendChild(cardEl);

    if(isRich){
      document.getElementById('wordAudioBtn').addEventListener('click', () => speak(card.word_es));
      document.getElementById('exampleAudioBtn').addEventListener('click', () => speak(card.example_es));
    }
    document.getElementById('knowBtn').addEventListener('click', markKnown);
    const learnBtn = document.getElementById('learnBtn');
    if(learnBtn) learnBtn.addEventListener('click', markLearn);

    // 滑動切換上一張 / 下一張（手機觸控）
    let touchStartX = null;
    cardEl.addEventListener('touchstart', (e)=>{
      touchStartX = e.changedTouches[0].clientX;
    }, {passive:true});
    cardEl.addEventListener('touchend', (e)=>{
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if(Math.abs(dx) < 50) return;
      if(dx < 0) goNext(); else goPrev();
    }, {passive:true});

    refreshStats();
    saveLastIndex();

    // fade-in
    requestAnimationFrame(()=>{ cardEl.classList.remove('fading'); });
  }

  function renderLibraryView(){
    subtitleEl.textContent = '收錄你按下「我要學習」的單字，可在此移除';
    progressRow.style.display = 'none';
    app.innerHTML = '';
    renderBackRow();

    const container = document.createElement('div');
    container.className = 'library-container';

    if(!libraryList.length){
      container.innerHTML = '<div class="library-empty">尚未加入任何單字。<br>在「單字學習」頁按下「我要學習」即可加入這裡。</div>';
    } else {
      const listEl = document.createElement('div');
      listEl.className = 'library-list';
      const sorted = libraryList.slice().sort((a,b)=> b.localeCompare(a));
      sorted.forEach(date => {
        const card = cards.find(c => c.date === date);
        if(!card) return;
        const row = document.createElement('div');
        row.className = 'library-card';
        row.innerHTML = `
          <div class="library-info">
            <div class="library-word">${card.word_es || card.word || ''}</div>
            <div class="library-zh">${card.word_zh || ''}</div>
          </div>
          <button class="library-audio audio-btn small" title="播放發音">🔊</button>
          <button class="library-remove" title="移除">✕</button>
        `;
        row.querySelector('.library-audio').addEventListener('click', () => {
          speak(card.word_es || card.word || '');
        });
        row.querySelector('.library-remove').addEventListener('click', () => {
          removeFromLibrary(date);
          renderLibraryView();
        });
        listEl.appendChild(row);
      });
      container.appendChild(listEl);
    }
    app.appendChild(container);
  }

  function renderView(){
    if(currentView === 'home') renderHomeView();
    else if(currentView === 'study') renderStudyView();
    else if(currentView === 'library') renderLibraryView();
  }

  window.addEventListener('beforeunload', saveLastIndex);
  window.addEventListener('pagehide', saveLastIndex);

  renderView();
})();
</script>
</body>
</html>
