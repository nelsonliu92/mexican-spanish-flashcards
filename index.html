<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>墨西哥每日一字 · 單字卡瀏覽器</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<link rel="manifest" href="icons/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日一字">
<meta name="theme-color" content="#046a38">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --card-w: min(92vw, 400px);
  }
  * { box-sizing: border-box; }

  html, body{
    width:100%;
    height:100%;
    overflow:hidden;
  }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    font-family:'Noto Sans TC', sans-serif;
    background:#eef0f6;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px;
    color:#1b1c22;
  }

  h1{
    display:none;
    font-family:'Fredoka', sans-serif;
    font-size:22px;
    letter-spacing:.5px;
    margin:0 0 4px;
    align-items:center;
    gap:8px;
    color:#20222b;
  }
  .subtitle{
    display:none;
    font-size:12.5px;
    color:#8a8d9c;
    margin-bottom:18px;
    text-align:center;
    min-height:16px;
  }
  #app{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .stage{
    max-height:calc(100dvh - 24px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card{
    max-height:calc(100dvh - 24px);
  }

  @media (max-height:760px){
    .stage{
      transform:scale(.88);
      transform-origin:center center;
    }
  }
  @media (max-height:660px){
    .stage{ transform:scale(.76); }
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    color:#6c6f80;
    width: var(--card-w);
    margin-bottom: 18px;
  }
  .progress-track{
    flex:1;
    height:7px;
    border-radius:99px;
    background: #dfe2ec;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg,#2e9e5b,#8fd19e);
    width:0%;
    transition: width .3s ease;
  }

  .stage{
    width: var(--card-w);
    max-width: 96vw;
  }

  .card{
    position:relative;
    width:100%;
    background:#fff;
    border-radius: 26px;
    box-shadow: 0 18px 40px rgba(20,22,40,0.14);
    overflow:hidden;
    opacity:1;
    transform: translateY(0);
    transition: opacity .22s ease, transform .22s ease;
  }
  .card.fading{ opacity:0; transform: translateY(8px); }

  /* ---- rich card (new format) ---- */
  .media{
    position:relative;
    width:100%;
    aspect-ratio: 4 / 3;
    background:#eee;
    overflow:hidden;
  }
  .media img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .status-indicator{
    position:absolute;
    top:14px; right:14px;
    width:54px; height:54px;
    border-radius:50%;
    background: #f7dfa0; /* 米黃底，兩種狀態底色相同 */
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    color:#1b1c22; /* 尚未知道 = 黑色圖示 */
    transition: color .15s ease;
  }
  .status-indicator.known{ color:#2e9e5b; } /* 已知道 = 綠色圖示 */
  .status-indicator svg{
    width:28px; height:28px;
    fill: currentColor;
    display:block;
  }

  .body{
    padding: 20px 24px 22px;
  }
  .word-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .word-es{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size: 30px;
    color:#16171d;
    line-height:1.15;
    word-break: break-word;
  }
  .audio-btn{
    flex:none;
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background:#1b1c22;
    color:#fff;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .audio-btn:hover{ background:#33343e; }
  .audio-btn:active{ transform: scale(.92); }
  .audio-btn.small{ width:32px; height:32px; font-size:13px; }

  .pos-row{
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .pos-badge{
    font-size:12px;
    font-weight:700;
    color:#6c6f80;
    background:#eef0f6;
    padding:3px 10px;
    border-radius:999px;
  }
  .word-zh{
    font-size:16.5px;
    font-weight:700;
    color:#2b2d36;
  }

  .desc-zh{
    margin-top:14px;
    font-size:13.5px;
    line-height:1.65;
    color:#565968;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:3;
    overflow:hidden;
  }
  .desc-zh.expandable{
    cursor:pointer;
    border-radius:8px;
  }
  .desc-zh.expandable:hover{ color:#2b2d36; }
  .desc-zh.expandable:focus-visible{
    outline:2px solid #2e9e5b;
    outline-offset:3px;
  }

  hr.divider{
    border:none;
    border-top:1px solid #eceef4;
    margin: 16px 0;
  }

  .example-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .example-es{
    font-size:14.5px;
    font-style:italic;
    color:#2b2d36;
    line-height:1.55;
  }
  .example-zh{
    margin-top:8px;
    font-size:13px;
    color:#8a8d9c;
    line-height:1.55;
  }

  .actions{
    display:flex;
    gap:10px;
    padding: 0 24px 8px;
  }
  .actions button{
    flex:1;
    padding: 13px 0;
    border-radius: 14px;
    font-size:14.5px;
    font-weight:700;
    font-family:'Noto Sans TC', sans-serif;
    cursor:pointer;
    border:2px solid #1b1c22;
    transition: transform .1s ease;
  }
  .actions button:active{ transform: scale(.97); }
  .btn-know{
    background:#fff;
    color:#1b1c22;
  }
  .btn-learn{
    background:#1b1c22;
    color:#fff;
  }
  .btn-learn:disabled{
    opacity:.55;
    cursor:default;
    transform:none !important;
  }
  .utility-actions{
    display:flex;
    gap:10px;
    padding: 0 24px 22px;
  }
  .card .progress-row{
    width:auto;
    margin:0;
    padding:0 24px 12px;
  }
  .utility-actions button{
    flex:1;
    padding:11px 0;
    border:1px solid #d7dae4;
    border-radius:12px;
    background:#f7f8fb;
    color:#5f6270;
    font-size:13.5px;
    font-weight:700;
    font-family:'Noto Sans TC', sans-serif;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .utility-actions button:hover{ background:#eceef4; }
  .utility-actions button:active{ transform:scale(.97); }

  .help-dialog{
    width:min(88vw, 360px);
    border:0;
    border-radius:20px;
    padding:0;
    color:#1b1c22;
    box-shadow:0 22px 60px rgba(20,22,40,.28);
  }
  .help-dialog::backdrop{ background:rgba(20,22,40,.48); }
  .help-dialog-content{ padding:24px; }
  .help-dialog-title{
    margin:0 0 12px;
    font-size:19px;
    font-weight:900;
  }
  .help-dialog-text{
    margin:0;
    color:#5f6270;
    font-size:14px;
    line-height:1.75;
  }
  .help-dialog-close{
    width:100%;
    margin-top:20px;
    padding:11px 0;
    border:0;
    border-radius:12px;
    background:#1b1c22;
    color:#fff;
    font-size:14px;
    font-weight:700;
    font-family:'Noto Sans TC', sans-serif;
    cursor:pointer;
  }

  /* ---- legacy card (old composited image) ---- */
  .legacy-img{
    width:100%;
    display:block;
    pointer-events:none;
  }

  .page-counter{
    font-size:13px;
    color:#6c6f80;
    min-width:56px;
    text-align:center;
  }

  .empty{
    text-align:center;
    color:#6c6f80;
    line-height:1.8;
    font-size:14px;
  }

  /* ---- home page ---- */
  .home-card{
    width: var(--card-w);
    max-width: 96vw;
    background:#fff;
    border-radius: 26px;
    box-shadow: 0 18px 40px rgba(20,22,40,0.14);
    padding: 48px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    text-align:center;
  }
  .home-flag{
    width:64px;
    height:42px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    overflow:hidden;
    border-radius:4px;
    box-shadow:0 3px 10px rgba(20,22,40,.18);
  }
  .home-flag-green{ background:#006847; }
  .home-flag-white{
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9b6a32;
    font-size:15px;
  }
  .home-flag-red{ background:#ce1126; }
  .home-title{
    font-family:'Fredoka', sans-serif;
    font-size:20px;
    font-weight:700;
    color:#20222b;
    margin:0 0 10px;
  }
  .home-btn{
    width:100%;
    padding:16px 0;
    border-radius:16px;
    font-size:16px;
    font-weight:700;
    font-family:'Noto Sans TC', sans-serif;
    cursor:pointer;
    border:2px solid #1b1c22;
    transition: transform .1s ease;
  }
  .home-btn:active{ transform: scale(.97); }
  .home-btn.primary{ background:#1b1c22; color:#fff; }
  .home-btn.secondary{ background:#fff; color:#1b1c22; }

  /* ---- back link ---- */
  .back-row{
    width: var(--card-w);
    max-width: 96vw;
    margin-bottom: 12px;
  }
  .back-link{
    background:none;
    border:none;
    color:#6c6f80;
    font-size:13px;
    cursor:pointer;
    padding:6px 0;
    display:flex;
    align-items:center;
    gap:4px;
    font-family:'Noto Sans TC', sans-serif;
  }
  .back-link:hover{ color:#1b1c22; }

  /* ---- library page ---- */
  .library-container{
    width: var(--card-w);
    max-width: 96vw;
    height:680px;
    display:flex;
    flex-direction:column;
  }
  .library-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .library-card{
    background:#fff;
    border-radius:18px;
    box-shadow: 0 8px 20px rgba(20,22,40,0.1);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .library-info{ flex:1; min-width:0; }
  .library-word{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:17px;
    color:#16171d;
    word-break: break-word;
  }
  .library-zh{
    font-size:12.5px;
    color:#8a8d9c;
    margin-top:2px;
  }
  .library-remove{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:#fdeaea;
    color:#d9483f;
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s ease;
  }
  .library-remove:hover{ background:#f8d3d1; }
  .library-page-indicator{
    margin:auto 0 10px;
    padding-top:14px;
    text-align:center;
    color:#6c6f80;
    font-size:12.5px;
  }
  .library-actions{
    margin-top:0;
    padding:0;
  }

  /* ---- alphabet page ---- */
  .alpha-media{
    position:relative;
    width:100%;
    aspect-ratio: 16 / 9;
    background:#c9d3e6;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .alpha-tile{
    width:58%;
    aspect-ratio: 3 / 2;
    background:#f4f5f8;
    border-radius:14px;
    transform: rotate(-6deg);
    box-shadow: 0 6px 16px rgba(20,22,40,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .alpha-upper{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:92px;
    line-height:1;
    color:#2a2b31;
  }
  .alpha-lower{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:54px;
    line-height:1;
    color:#3b4a8c;
    margin-top:26px;
  }
  .alpha-type-badge{
    position:absolute;
    top:14px; right:14px;
    padding:5px 12px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:700;
    background:#f7dfa0;
    color:#1b1c22;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .alpha-type-badge.consonant{ background:#bfe3cc; }
  .alpha-name{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:26px;
    color:#16171d;
    line-height:1.15;
  }
  .alpha-name small{
    font-family:'Noto Sans TC', sans-serif;
    font-size:13px;
    font-weight:500;
    color:#8a8d9c;
    margin-left:6px;
  }
  .alpha-ipa{
    font-size:15px;
    font-weight:700;
    color:#2b2d36;
  }
  .alpha-desc{
    margin-top:12px;
    font-size:13.5px;
    line-height:1.65;
    color:#565968;
  }
  .alpha-examples{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .alpha-example{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .alpha-example img{
    flex:none;
    width:58px; height:58px;
    object-fit:contain;
    border-radius:12px;
    background:#fff;
  }
  .alpha-example-text{ flex:1; min-width:0; }
  .alpha-example-es{
    font-size:18px;
    font-weight:500;
    color:#2b2d36;
    font-family:'Noto Sans TC', sans-serif;
  }
  .alpha-example-es b{
    color:#3a86c8;
    font-weight:700;
  }
  .alpha-example-zh{
    font-size:12.5px;
    color:#8a8d9c;
    margin-top:1px;
  }
  .alpha-tabs{
    display:flex;
    gap:10px;
    padding: 0 24px 8px;
  }
  .alpha-tabs button{
    flex:1;
    padding: 13px 0;
    border-radius: 14px;
    font-size:14.5px;
    font-weight:700;
    font-family:'Noto Sans TC', sans-serif;
    cursor:pointer;
    border:2px solid #1b1c22;
    background:#fff;
    color:#1b1c22;
    transition: transform .1s ease;
  }
  .alpha-tabs button.active{ background:#1b1c22; color:#fff; }
  .alpha-tabs button:active{ transform: scale(.97); }
</style>
</head>
<body>

  <h1>🇲🇽 墨西哥每日一字 · 單字卡瀏覽器</h1>
  <div class="subtitle" id="subtitleText"></div>

  <div id="app"><div class="empty" id="loadingMsg">載入中…</div></div>

  <dialog class="help-dialog" id="helpDialog" aria-labelledby="helpDialogTitle">
    <div class="help-dialog-content">
      <h2 class="help-dialog-title" id="helpDialogTitle">操作說明</h2>
      <p class="help-dialog-text" id="helpDialogText"></p>
      <button class="help-dialog-close" id="helpDialogClose">我知道了</button>
    </div>
  </dialog>

<script>
  // 防呆機制：如果 manifest.js 一直載入不出來（例如 OneDrive 檔案還沒完全同步到本機），
  // 幾秒後明確顯示錯誤訊息，而不是讓畫面一直維持空白。
  function mxShowTimeoutMsg(){
    var el = document.getElementById('app');
    if(el) el.innerHTML = '<div class="empty">⚠️ 單字資料載入逾時。<br>請確認 manifest.js 與此頁面在同一個資料夾，且此裝置的 OneDrive 已完整同步該檔案（非僅雲端佔位檔），再重新整理頁面試試看。</div>';
  }
  function mxShowManifestErrorMsg(){
    clearTimeout(window.__mxLoadTimer);
    var el = document.getElementById('app');
    if(el) el.innerHTML = '<div class="empty">⚠️ 找不到 manifest.js，請確認它與「單字卡瀏覽器.html」放在同一個資料夾內。</div>';
  }
  window.__mxLoadTimer = setTimeout(mxShowTimeoutMsg, 4000);
</script>
<script src="manifest.js" onerror="mxShowManifestErrorMsg()"></script>
<script>
clearTimeout(window.__mxLoadTimer);
(function(){
  const cards = (window.CARD_LIST || []).slice().sort((a,b)=> a.date.localeCompare(b.date));
  const app = document.getElementById('app');
  const subtitleEl = document.getElementById('subtitleText');

  if(!cards.length){
    app.innerHTML = '<div class="empty">目前還沒有任何單字卡。<br>每天排程執行後，新卡片會自動出現在這裡。</div>';
    return;
  }

  const STATUS_KEY = 'mx_word_ok_status_v1';       // {date: true(已知) / false(待複習)}
  const LIBRARY_KEY = 'mx_word_library_v1';        // [date, date, ...] 我的單字庫
  const LAST_PAGE_KEY = 'mx_word_last_page_v1';

  function loadJSON(key, fallback){
    try{ return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }catch(e){ return fallback; }
  }
  function saveJSON(key, obj){
    localStorage.setItem(key, JSON.stringify(obj));
  }

  let statusMap = loadJSON(STATUS_KEY, {});
  let libraryList = loadJSON(LIBRARY_KEY, []);

  function loadLastIndex(){
    try{
      const savedDate = localStorage.getItem(LAST_PAGE_KEY);
      if(savedDate){
        const found = cards.findIndex(c => c.date === savedDate);
        if(found >= 0) return found;
      }
    }catch(e){}
    return 0;
  }
  function saveLastIndex(){
    try{ localStorage.setItem(LAST_PAGE_KEY, cards[idx].date); }catch(e){}
  }

  let idx = loadLastIndex();
  let libraryPage = 0;
  const LIBRARY_PAGE_SIZE = 8;
  let currentView = 'home'; // 'home' | 'study' | 'library' | 'alphabet'

  // ---- 字母與發音資料：{x} 表示範例單字中要以藍色標示的字母 ----
  const ALPHABET = [
    {u:'A', l:'a', key:'a', type:'vowel', name:'a', say:'a', ipa:'[a]', desc:'似英文 father 的 [a]，嘴巴張大、短而清楚，不拖長。',
      ex:[{es:'el {a}guacate', zh:'酪梨'}, {es:'la c{a}sa', zh:'房子'}]},
    {u:'E', l:'e', key:'e', type:'vowel', name:'e', say:'e', ipa:'[e]', desc:'似英文 bed 的 [e]，短而乾淨，不滑成英文 day 的 [eɪ]。',
      ex:[{es:'el {e}lote', zh:'玉米（墨西哥烤玉米）'}, {es:'la m{e}sa', zh:'桌子'}]},
    {u:'I', l:'i', key:'i', type:'vowel', name:'i', say:'i', ipa:'[i]', desc:'似英文 see 的 [i]，但更短促，嘴角往兩側拉。',
      ex:[{es:'la {i}glesia', zh:'教堂'}, {es:'el ch{i}le', zh:'辣椒'}]},
    {u:'O', l:'o', key:'o', type:'vowel', name:'o', say:'o', ipa:'[o]', desc:'似英文 or 的 [o]，嘴唇圓，不滑成英文 go 的 [oʊ]。',
      ex:[{es:'el {o}jo', zh:'眼睛'}, {es:'el s{o}l', zh:'太陽'}]},
    {u:'U', l:'u', key:'u', type:'vowel', name:'u', say:'u', ipa:'[u]', desc:'似英文 cool 的 [uː]，嘴唇圓而突出，但比英文短。',
      ex:[{es:'la l{u}na', zh:'月亮'}, {es:'la {u}va', zh:'葡萄'}]},

    {u:'B', l:'b', key:'b', type:'consonant', name:'be', say:'be', ipa:'[b]', desc:'似英文 b。兩個母音之間嘴唇不完全閉合，聲音較柔。墨西哥 B 與 V 發音完全相同。',
      ex:[{es:'el {b}urro', zh:'驢子'}, {es:'el {b}arco', zh:'船'}]},
    {u:'C', l:'c', key:'c', type:'consonant', name:'ce', say:'ce', ipa:'[k] / [s]', desc:'接 a、o、u 時發 [k]；接 e、i 時發 [s]（墨西哥不發西班牙的咬舌音 [θ]）。',
      ex:[{es:'el {c}afé', zh:'咖啡 [k]'}, {es:'la {c}ebolla', zh:'洋蔥 [s]'}]},
    {u:'D', l:'d', key:'d', type:'consonant', name:'de', say:'de', ipa:'[d]', desc:'舌尖輕碰上排門牙背面發 [d]；兩個母音之間變柔，接近英文 this 的 th。',
      ex:[{es:'el {d}inero', zh:'錢'}, {es:'el {d}ulce', zh:'糖果'}]},
    {u:'F', l:'f', key:'f', type:'consonant', name:'efe', say:'efe', ipa:'[f]', desc:'同英文 f，上排門牙輕碰下唇送氣。',
      ex:[{es:'la {f}lor', zh:'花'}, {es:'la {f}resa', zh:'草莓'}]},
    {u:'G', l:'g', key:'g', type:'consonant', name:'ge', say:'ge', ipa:'[g] / [x]', desc:'接 a、o、u 時發 [g]；接 e、i 時發喉音 [x]，像用力哈氣的 h。',
      ex:[{es:'el {g}ato', zh:'貓 [g]'}, {es:'el {g}irasol', zh:'向日葵 [x]'}]},
    {u:'H', l:'h', key:'h', type:'consonant', name:'hache', say:'hache', ipa:'（不發音）', desc:'啞音，完全不發音。hue 開頭唸起來像英文的 we。（CH 組合則發 [tʃ]，同英文 church。）',
      ex:[{es:'el {h}elado', zh:'冰淇淋'}, {es:'el {h}uevo', zh:'蛋'}]},
    {u:'J', l:'j', key:'j', type:'consonant', name:'jota', say:'jota', ipa:'[x]', desc:'喉嚨後方送氣的 [x]，像用力哈氣的 h；墨西哥口音比西班牙輕柔。',
      ex:[{es:'el {j}itomate', zh:'番茄（墨西哥用語）'}, {es:'el {j}ugo', zh:'果汁'}]},
    {u:'K', l:'k', key:'k', type:'consonant', name:'ka', say:'ka', ipa:'[k]', desc:'發 [k]，不送氣；只出現在外來語。',
      ex:[{es:'el {k}iwi', zh:'奇異果'}, {es:'el {k}oala', zh:'無尾熊'}]},
    {u:'L', l:'l', key:'l', type:'consonant', name:'ele', say:'ele', ipa:'[l]', desc:'似英文 l，但舌尖清楚貼上齒齦，字尾也不含糊。雙寫 LL 在墨西哥唸成像 Y。',
      ex:[{es:'el {l}imón', zh:'萊姆（綠檸檬）'}, {es:'la {l}eche', zh:'牛奶'}]},
    {u:'M', l:'m', key:'m', type:'consonant', name:'eme', say:'eme', ipa:'[m]', desc:'同英文 m，雙唇閉合發鼻音。',
      ex:[{es:'la {m}ano', zh:'手'}, {es:'el {m}ango', zh:'芒果'}]},
    {u:'N', l:'n', key:'n', type:'consonant', name:'ene', say:'ene', ipa:'[n]', desc:'同英文 n，舌尖抵上齒齦發鼻音。',
      ex:[{es:'la {n}aranja', zh:'柳橙'}, {es:'la {n}ube', zh:'雲'}]},
    {u:'Ñ', l:'ñ', key:'ny', type:'consonant', name:'eñe', say:'eñe', ipa:'[ɲ]', desc:'似英文 canyon 的 ny，像「ㄋ」加「ㄧ」快速連讀。西語特有字母。',
      ex:[{es:'la pi{ñ}a', zh:'鳳梨'}, {es:'el ni{ñ}o', zh:'男孩'}]},
    {u:'P', l:'p', key:'p', type:'consonant', name:'pe', say:'pe', ipa:'[p]', desc:'似英文 p，但不送氣，聽起來介於 p 與 b 之間。',
      ex:[{es:'el {p}an', zh:'麵包'}, {es:'el {p}erro', zh:'狗'}]},
    {u:'Q', l:'q', key:'q', type:'consonant', name:'cu', say:'cu', ipa:'[k]', desc:'只出現在 que、qui，發 [k]，後面的 u 不發音。',
      ex:[{es:'el {q}ueso', zh:'起司'}, {es:'la {q}uesadilla', zh:'起司薄餅'}]},
    {u:'R', l:'r', key:'r', type:'consonant', name:'erre', say:'erre', ipa:'[ɾ] / [r]', desc:'字中單一 r 舌尖輕彈一下 [ɾ]；字首或雙寫 rr 要連續彈舌 [r]。',
      ex:[{es:'la pe{r}a', zh:'梨子（輕彈）'}, {es:'el ca{rr}o', zh:'汽車（彈舌）'}]},
    {u:'S', l:'s', key:'s', type:'consonant', name:'ese', say:'ese', ipa:'[s]', desc:'同英文 s，清晰的 [s]，墨西哥字尾的 s 也會清楚唸出。',
      ex:[{es:'la {s}andía', zh:'西瓜'}, {es:'la {s}illa', zh:'椅子'}]},
    {u:'T', l:'t', key:'t', type:'consonant', name:'te', say:'te', ipa:'[t]', desc:'舌尖碰上排門牙背面，不送氣，比英文 t 輕脆。',
      ex:[{es:'el {t}aco', zh:'塔可'}, {es:'la {t}ortilla', zh:'玉米餅'}]},
    {u:'V', l:'v', key:'v', type:'consonant', name:'ve', say:'ve', ipa:'[b]', desc:'與 B 同音 [b]，不發英文 v 的咬唇音。墨西哥常叫它「ve chica」以區分 B（be grande）。',
      ex:[{es:'la {v}aca', zh:'乳牛'}, {es:'la {v}entana', zh:'窗戶'}]},
    {u:'W', l:'w', key:'w', type:'consonant', name:'doble u', say:'doble u', ipa:'[w]', desc:'只出現在外來語，發 [w]，同英文 w。墨西哥也常叫它「doble ve」。',
      ex:[{es:'el {w}afle', zh:'鬆餅'}, {es:'el sánd{w}ich', zh:'三明治'}]},
    {u:'X', l:'x', key:'x', type:'consonant', name:'equis', say:'equis', ipa:'[ks] / [x]', desc:'一般發 [ks]；但墨西哥許多地名保留古音唸 [x]，例如 México 唸成「Méjico」。',
      ex:[{es:'el ta{x}i', zh:'計程車 [ks]'}, {es:'Mé{x}ico', zh:'墨西哥 [x]'}]},
    {u:'Y', l:'y', key:'y', type:'consonant', name:'ye', say:'ye', ipa:'[ʝ] / [i]', desc:'當子音時發 [ʝ]，似英文 yes 但更用力；單獨或在字尾（y、hoy）時發 [i]。',
      ex:[{es:'el {y}ogur', zh:'優格'}, {es:'la pla{y}a', zh:'海灘'}]},
    {u:'Z', l:'z', key:'z', type:'consonant', name:'zeta', say:'zeta', ipa:'[s]', desc:'墨西哥發 [s]，與 S 相同，不發英文 z 的 [z]，也不發西班牙的咬舌音。',
      ex:[{es:'el {z}apato', zh:'鞋子'}, {es:'la {z}anahoria', zh:'紅蘿蔔'}]}
  ];
  const ALPHA_LAST_KEY = 'mx_alpha_last_v1';
  let alphaIdx = 0;
  try{
    const savedAlpha = localStorage.getItem(ALPHA_LAST_KEY);
    const f = ALPHABET.findIndex(a => a.key === savedAlpha);
    if(f >= 0) alphaIdx = f;
  }catch(e){}

  function speak(text){
    if(!text || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-MX';
      u.rate = 0.95;
      const voices = speechSynthesis.getVoices();
      const esVoice = voices.find(v => v.lang === 'es-MX') || voices.find(v => v.lang && v.lang.startsWith('es'));
      if(esVoice) u.voice = esVoice;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  // warm up voice list (some browsers load it async)
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  function isKnown(date){ return statusMap[date] === true; }

  // 找出第一張「尚未知道」的卡片索引（找不到就回第一張）
  function findFirstUnknownIndex(){
    const i = cards.findIndex(c => !isKnown(c.date));
    return i >= 0 ? i : 0;
  }
  function inLibrary(date){ return libraryList.indexOf(date) >= 0; }

  function addToLibrary(date){
    if(!inLibrary(date)){
      libraryList.push(date);
      saveJSON(LIBRARY_KEY, libraryList);
    }
  }
  function removeFromLibrary(date){
    libraryList = libraryList.filter(d => d !== date);
    saveJSON(LIBRARY_KEY, libraryList);
  }

  function goHome(){
    currentView = 'home';
    renderView();
  }

  function openDialog(title, text){
    document.getElementById('helpDialogTitle').textContent = title;
    document.getElementById('helpDialogText').textContent = text;
    document.getElementById('helpDialog').showModal();
  }

  function openHelp(text){
    openDialog('操作說明', text);
  }

  function refreshStats(){
    const total = cards.length;
    const knownCount = cards.filter(c => statusMap[c.date] === true).length;
    document.getElementById('progressFill').style.width = (knownCount / total * 100).toFixed(1) + '%';
    document.getElementById('okCounter').textContent = '已知道 ' + knownCount + ' / ' + total;
    document.getElementById('pageCounter').textContent = (idx+1) + ' / ' + total;
  }

  function renderRichCard(card, i){

    const alreadyInLib = inLibrary(card.date);
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="media">
        <img src="${card.image}" alt="${card.word_es}">
        <div class="status-indicator ${known ? 'known' : ''}" title="${known ? '已知道' : '尚未知道'}">
          <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
        </div>
      </div>
      <div class="body">
        <div class="word-row">
          <div class="word-es">${card.word_es}</div>
          <button class="audio-btn" id="wordAudioBtn" title="播放發音">🔊</button>
        </div>
        <div class="pos-row">
          <span class="pos-badge">${card.pos || ''}</span>
          <span class="word-zh">${card.word_zh || ''}</span>

        <hr class="divider">

          <button class="audio-btn small" id="exampleAudioBtn" title="播放例句發音">🔊</button>
        </div>
        <div class="example-zh">${card.example_zh || ''}</div>
      </div>
      <div class="progress-row" id="progressRow">

      </div>
      <div class="actions">

  function renderLegacyCard(card, i){
    const alreadyInLib = inLibrary(card.date);
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <img class="legacy-img" src="每日一字/${card.file}" alt="${card.word || ''}">
      <div class="progress-row" id="progressRow">
        <span id="okCounter"></span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><span id="pageCounter"></span>
      </div>
      <div class="actions">
        <button class="btn-know" id="knowBtn">我知道了</button>
        <button class="btn-learn" id="learnBtn" ${alreadyInLib ? 'disabled' : ''}>${alreadyInLib ? '✓ 已加入單字庫' : '我要學習'}</button>
      </div>
      <div class="utility-actions">
        <button id="cardHomeBtn">返回主頁</button>
        <button id="helpBtn">操作說明</button>
      </div>
    `;
    return wrap;
  }

  // 「我知道了」：可重複切換 —— 第一次按 +1 變綠燈，再按一次 -1 變回黑燈，停留在目前這張卡片
  function markKnown(){
    const date = cards[idx].date;
    const nowKnown = !(statusMap[date] === true);
    if(nowKnown){
      statusMap[date] = true;
    } else {
      delete statusMap[date];
    }
    saveJSON(STATUS_KEY, statusMap);
    refreshStats();

    const indicator = document.querySelector('.status-indicator');
    if(indicator){
      indicator.classList.toggle('known', nowKnown);
      indicator.title = nowKnown ? '已知道' : '尚未知道';
    }
  }

  // 「我要學習」：標記待複習並加入單字庫，停留在目前這張卡片（不換頁）
  function markLearn(){
    const date = cards[idx].date;
    statusMap[date] = false;
    saveJSON(STATUS_KEY, statusMap);
    addToLibrary(date);
    refreshStats();

    const indicator = document.querySelector('.status-indicator');
    if(indicator){
      indicator.classList.remove('known');
      indicator.title = '尚未知道';
    }
    const learnBtn = document.getElementById('learnBtn');
    if(learnBtn){
      learnBtn.disabled = true;
      learnBtn.textContent = '✓ 已加入單字庫';
    }
  }

  function goTo(newIdx){
    if(newIdx < 0 || newIdx >= cards.length || newIdx === idx) return;
    idx = newIdx;
    renderStudyView();
  }
  function goNext(){ goTo(idx+1); }
  function goPrev(){ goTo(idx-1); }

  document.addEventListener('keydown', (e)=>{
    if(currentView === 'study'){
      if(e.key === 'ArrowRight') goNext();
      if(e.key === 'ArrowLeft') goPrev();
    } else if(currentView === 'library'){
      if(e.key === 'ArrowRight') changeLibraryPage(1);
      if(e.key === 'ArrowLeft') changeLibraryPage(-1);
    } else if(currentView === 'alphabet'){
      if(e.key === 'ArrowRight') alphaGoTo(alphaIdx + 1);
      if(e.key === 'ArrowLeft') alphaGoTo(alphaIdx - 1);
    }
  });

  function renderBackRow(){
    const row = document.createElement('div');
    row.className = 'back-row';
    row.innerHTML = `<button class="back-link" id="backHomeBtn">‹ 返回主頁</button>`;
    app.appendChild(row);
    document.getElementById('backHomeBtn').addEventListener('click', ()=>{
      currentView = 'home';
      renderView();
    });
  }

  function renderHomeView(){
    subtitleEl.textContent = '選擇你想做的事';
    app.innerHTML = '';
    const homeCard = document.createElement('div');
    homeCard.className = 'home-card';
    homeCard.innerHTML = `
      <div class="home-flag" role="img" aria-label="墨西哥國旗">
        <span class="home-flag-green"></span>
        <span class="home-flag-white">●</span>
        <span class="home-flag-red"></span>
      </div>
      <div class="home-title">墨西哥西語單字庫</div>
      <button class="home-btn primary" id="btnStudy">📖 單字學習</button>
      <button class="home-btn secondary" id="btnLibrary">⭐ 我的單字庫</button>
      <button class="home-btn secondary" id="btnAlphabet">🔤 字母與發音</button>
    `;
    app.appendChild(homeCard);
    document.getElementById('btnAlphabet').addEventListener('click', ()=>{
      currentView = 'alphabet';
      renderView();
    });
    document.getElementById('btnStudy').addEventListener('click', ()=>{
      idx = findFirstUnknownIndex();
      currentView = 'study';
      renderView();
    });
    document.getElementById('btnLibrary').addEventListener('click', ()=>{
      libraryPage = 0;
      currentView = 'library';
      renderView();
    });
  }

  function renderStudyView(){
    subtitleEl.textContent = '';
    app.innerHTML = '';

    const stage = document.createElement('div');
    stage.className = 'stage';
    app.appendChild(stage);

    const card = cards[idx];
    const isRich = !!card.word_es;
    const cardEl = document.createElement('div');
    cardEl.className = 'card fading';
    cardEl.appendChild(isRich ? renderRichCard(card, idx) : renderLegacyCard(card, idx));

    stage.innerHTML = '';
    stage.appendChild(cardEl);

    if(isRich){
      document.getElementById('wordAudioBtn').addEventListener('click', () => speak(card.word_es));
      document.getElementById('exampleAudioBtn').addEventListener('click', () => speak(card.example_es));
      const descriptionEl = document.getElementById('cardDescription');
      if(descriptionEl){
        requestAnimationFrame(()=>{
          if(descriptionEl.scrollHeight > descriptionEl.clientHeight + 1){
            descriptionEl.classList.add('expandable');
            descriptionEl.tabIndex = 0;
            descriptionEl.setAttribute('role', 'button');
            descriptionEl.setAttribute('aria-label', '查看完整單字說明');
            descriptionEl.title = '點擊查看完整說明';
            const showFullDescription = ()=> openDialog('完整單字說明', card.desc_zh);
            descriptionEl.addEventListener('click', showFullDescription);
            descriptionEl.addEventListener('keydown', (e)=>{
              if(e.key === 'Enter' || e.key === ' '){
                e.preventDefault();
                showFullDescription();
              }
            });
          }
        });
      }
    }
    document.getElementById('knowBtn').addEventListener('click', markKnown);
    const learnBtn = document.getElementById('learnBtn');
    if(learnBtn) learnBtn.addEventListener('click', markLearn);
    document.getElementById('cardHomeBtn').addEventListener('click', goHome);
    document.getElementById('helpBtn').addEventListener('click', ()=>{
      openHelp('左右滑動或鍵盤方向鍵切換 · 點喇叭聽發音 · 標記「我知道了 / 我要學習」追蹤進度');
    });

    // 滑動切換上一張 / 下一張（手機觸控）
    let touchStartX = null;
    cardEl.addEventListener('touchstart', (e)=>{
      touchStartX = e.changedTouches[0].clientX;
    }, {passive:true});
    cardEl.addEventListener('touchend', (e)=>{
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if(Math.abs(dx) < 50) return;
      if(dx < 0) goNext(); else goPrev();
    }, {passive:true});

    refreshStats();
    saveLastIndex();

    // fade-in
    requestAnimationFrame(()=>{ cardEl.classList.remove('fading'); });
  }

  function changeLibraryPage(delta){
    const totalPages = Math.max(1, Math.ceil(libraryList.length / LIBRARY_PAGE_SIZE));
    const nextPage = libraryPage + delta;
    if(nextPage < 0 || nextPage >= totalPages || nextPage === libraryPage) return;
    libraryPage = nextPage;
    renderLibraryView();
  }

  function renderLibraryView(){
    subtitleEl.textContent = '收錄你按下「我要學習」的單字，可在此移除';
    app.innerHTML = '';

    const container = document.createElement('div');
    container.className = 'library-container';
    const sorted = libraryList.slice().sort((a,b)=> b.localeCompare(a));
    const totalPages = Math.max(1, Math.ceil(sorted.length / LIBRARY_PAGE_SIZE));
    libraryPage = Math.min(libraryPage, totalPages - 1);
    const pageItems = sorted.slice(libraryPage * LIBRARY_PAGE_SIZE, (libraryPage + 1) * LIBRARY_PAGE_SIZE);

    if(pageItems.length){
      const listEl = document.createElement('div');
      listEl.className = 'library-list';
      pageItems.forEach(date => {
        const card = cards.find(c => c.date === date);
        if(!card) return;
        const row = document.createElement('div');
        row.className = 'library-card';
        row.innerHTML = `
          <div class="library-info">
            <div class="library-word">${card.word_es || card.word || ''}</div>
            <div class="library-zh">${card.word_zh || ''}</div>
          </div>
          <button class="library-audio audio-btn small" title="播放發音">🔊</button>
          <button class="library-remove" title="移除">✕</button>
        `;
        row.querySelector('.library-audio').addEventListener('click', () => {
          speak(card.word_es || card.word || '');
        });
        row.querySelector('.library-remove').addEventListener('click', () => {
          removeFromLibrary(date);
          renderLibraryView();
        });
        listEl.appendChild(row);
      });
      container.appendChild(listEl);
    }
    const pageIndicator = document.createElement('div');
    pageIndicator.className = 'library-page-indicator';
    pageIndicator.textContent = (libraryPage + 1) + ' / ' + totalPages;
    container.appendChild(pageIndicator);

    const libraryActions = document.createElement('div');
    libraryActions.className = 'utility-actions library-actions';
    libraryActions.innerHTML = `
      <button id="libraryHomeBtn">返回主頁</button>
      <button id="libraryHelpBtn">操作說明</button>
    `;
    container.appendChild(libraryActions);
    app.appendChild(container);
    document.getElementById('libraryHomeBtn').addEventListener('click', goHome);
    document.getElementById('libraryHelpBtn').addEventListener('click', ()=>{
      openHelp('尚未加入任何單字。在「單字學習」頁按下「我要學習」即可加入這裡。');
    });

    let touchStartX = null;
    container.addEventListener('touchstart', (e)=>{
      touchStartX = e.changedTouches[0].clientX;
    }, {passive:true});
    container.addEventListener('touchend', (e)=>{
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if(Math.abs(dx) < 50) return;
      changeLibraryPage(dx < 0 ? 1 : -1);
    }, {passive:true});
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  }
  function alphaHighlight(es){
    return escapeHTML(es).replace(/\{([^}]+)\}/g, '<b>$1</b>');
  }
  function alphaPlain(es){ return es.replace(/[{}]/g, ''); }

  function alphaGoTo(newIdx){
    if(newIdx < 0 || newIdx >= ALPHABET.length || newIdx === alphaIdx) return;
    alphaIdx = newIdx;
    renderAlphabetView();
  }

  function renderAlphabetView(){
    subtitleEl.textContent = '';
    app.innerHTML = '';
    const item = ALPHABET[alphaIdx];
    const isVowel = item.type === 'vowel';
    const group = ALPHABET.filter(a => a.type === item.type);
    const posInGroup = group.indexOf(item) + 1;
    const vowelCount = ALPHABET.filter(a => a.type === 'vowel').length;
    const consonantCount = ALPHABET.length - vowelCount;

    const stage = document.createElement('div');
    stage.className = 'stage';
    app.appendChild(stage);

    const cardEl = document.createElement('div');
    cardEl.className = 'card fading';
    cardEl.innerHTML = `
      <div class="alpha-media" role="img" aria-label="字母 ${item.u} ${item.l}">
        <div class="alpha-tile">
          <span class="alpha-upper">${item.u}</span><span class="alpha-lower">${item.l}</span>
        </div>
        <div class="alpha-type-badge ${isVowel ? '' : 'consonant'}">${isVowel ? '母音' : '子音'}</div>
      </div>
      <div class="body">
        <div class="word-row">
          <div class="alpha-name">${item.u} ${item.l}<small>唸作「${escapeHTML(item.name)}」</small></div>
          <button class="audio-btn" id="alphaLetterAudio" title="播放字母發音">🔊</button>
        </div>
        <div class="pos-row">
          <span class="pos-badge">發音</span>
          <span class="alpha-ipa">${escapeHTML(item.ipa)}</span>
        </div>
        <div class="alpha-desc">${escapeHTML(item.desc)}</div>
        <hr class="divider">
        <div class="alpha-examples">
          ${item.ex.map((ex, n) => `
            <div class="alpha-example">
              <img src="alphabet/${item.key}${n+1}.jpg" alt="${escapeHTML(ex.zh)}">
              <div class="alpha-example-text">
                <div class="alpha-example-es">${alphaHighlight(ex.es)}</div>
                <div class="alpha-example-zh">${escapeHTML(ex.zh)}</div>
              </div>
              <button class="audio-btn small alpha-ex-audio" data-n="${n}" title="播放單字發音">🔊</button>
            </div>`).join('')}
        </div>
      </div>
      <div class="progress-row">
        <span>${isVowel ? '母音' : '子音'} ${posInGroup} / ${group.length}</span><div class="progress-track"><div class="progress-fill" style="width:${((alphaIdx+1)/ALPHABET.length*100).toFixed(1)}%"></div></div><span class="page-counter" style="min-width:auto">${alphaIdx+1} / ${ALPHABET.length}</span>
      </div>
      <div class="alpha-tabs">
        <button id="alphaVowelTab" class="${isVowel ? 'active' : ''}">母音（${vowelCount}）</button>
        <button id="alphaConsonantTab" class="${isVowel ? '' : 'active'}">子音（${consonantCount}）</button>
      </div>
      <div class="utility-actions">
        <button id="alphaHomeBtn">返回主頁</button>
        <button id="alphaHelpBtn">操作說明</button>
      </div>
    `;
    stage.appendChild(cardEl);

    document.getElementById('alphaLetterAudio').addEventListener('click', ()=> speak(item.say));
    cardEl.querySelectorAll('.alpha-ex-audio').forEach(btn => {
      btn.addEventListener('click', ()=> speak(alphaPlain(item.ex[+btn.dataset.n].es)));
    });
    document.getElementById('alphaVowelTab').addEventListener('click', ()=>{
      if(!isVowel) alphaGoTo(ALPHABET.findIndex(a => a.type === 'vowel'));
    });
    document.getElementById('alphaConsonantTab').addEventListener('click', ()=>{
      if(isVowel) alphaGoTo(ALPHABET.findIndex(a => a.type === 'consonant'));
    });
    document.getElementById('alphaHomeBtn').addEventListener('click', goHome);
    document.getElementById('alphaHelpBtn').addEventListener('click', ()=>{
      openHelp('左右滑動或鍵盤方向鍵切換字母 · 點「母音 / 子音」直接跳到該組 · 點喇叭聽字母與範例單字發音 · 藍色字母為該字母在單字中的位置');
    });

    let touchStartX = null;
    cardEl.addEventListener('touchstart', (e)=>{
      touchStartX = e.changedTouches[0].clientX;
    }, {passive:true});
    cardEl.addEventListener('touchend', (e)=>{
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if(Math.abs(dx) < 50) return;
      alphaGoTo(alphaIdx + (dx < 0 ? 1 : -1));
    }, {passive:true});

    try{ localStorage.setItem(ALPHA_LAST_KEY, item.key); }catch(e){}
    requestAnimationFrame(()=>{ cardEl.classList.remove('fading'); });
  }

  function renderView(){
    if(currentView === 'home') renderHomeView();
    else if(currentView === 'study') renderStudyView();
    else if(currentView === 'library') renderLibraryView();
    else if(currentView === 'alphabet') renderAlphabetView();
  }

  const helpDialog = document.getElementById('helpDialog');
  document.getElementById('helpDialogClose').addEventListener('click', ()=> helpDialog.close());
  helpDialog.addEventListener('click', (e)=>{
    if(e.target === helpDialog) helpDialog.close();
  });

  window.addEventListener('beforeunload', saveLastIndex);
  window.addEventListener('pagehide', saveLastIndex);

  renderView();
})();
</script>
</body>
</html>
